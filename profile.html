<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public-Show - प्रोफाइल</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #fff;
            border-bottom: 1px solid #dbdbdb;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-family: 'Brush Script MT', cursive;
            font-size: 28px;
            color: #262626;
            font-weight: bold;
        }
        .nav-links a {
            text-decoration: none;
            color: #262626;
            margin-left: 15px;
            font-weight: bold;
            font-size: 14px;
        }
        .profile-container {
            max-width: 600px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }
        .profile-pic-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #dbdbdb;
            margin-right: 30px;
        }
        .profile-info h2 {
            margin: 0 0 5px 0;
            font-size: 20px;
            color: #262626;
        }
        .profile-info p {
            margin: 0;
            color: #8e8e8e;
            font-size: 14px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .gallery-item {
            background-color: #efefef;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #8e8e8e;
            font-size: 12px;
            border: 1px solid #dbdbdb;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Public-Show</div>
        <div class="nav-links">
            <a href="stage.html">होम</a>
            <a href="profile.html">प्रोफाइल</a>
            <a href="index.html">लॉग आउट</a>
        </div>
    </header>

    <div class="profile-container">
        <div class="profile-header">
            <div class="profile-pic-large"></div>
            <div class="profile-info">
                <h2>andip_kumar</h2>
                <p>पब्लिक शो क्रिएटर | अपनी कला दुनिया तक पहुँचाना</p>
            </div>
        </div>

        <hr style="border: none; border-top: 1px solid #dbdbdb; margin-bottom: 20px;">

        <div class="gallery">
            <div class="gallery-item">शो 1</div>
            <div class="gallery-item">शो 2</div>
            <div class="gallery-item">शो 3</div>
        </div>
    </div>

</body>
</html>
