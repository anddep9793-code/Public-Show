<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public-Show - Login / Sign Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border: 1px solid #dbdbdb;
            width: 320px;
            text-align: center;
            border-radius: 4px;
        }
        h1 {
            font-family: cursive;
            margin-bottom: 20px;
            color: #262626;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1877f2;
        }
        .switch {
            margin-top: 15px;
            font-size: 14px;
            color: #737373;
        }
        .switch a {
            color: #0095f6;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Public-Show</h1>
        <form>
            <input type="text" placeholder="मोबाइल नंबर, यूजरनेम या ईमेल" required>
            <input type="password" placeholder="पासवर्ड" required>
            <button type="submit">लॉग इन करें</button>
        </form>
        <div class="switch">
            खाता नहीं है? <a href="#">साइन अप करें</a>
        </div>
    </div>

</body>
  </html>
