<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public-Show - संदेश (Messages)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #fff;
            border-bottom: 1px solid #dbdbdb;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-family: 'Brush Script MT', cursive;
            font-size: 28px;
            color: #262626;
            font-weight: bold;
        }
        .nav-links a {
            text-decoration: none;
            color: #262626;
            margin-left: 15px;
            font-weight: bold;
            font-size: 14px;
        }
        .chat-container {
            max-width: 500px;
            margin: 20px auto;
            background-color: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            padding: 15px;
        }
        .chat-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #262626;
            border-bottom: 1px solid #dbdbdb;
            padding-bottom: 10px;
        }
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #efefef;
            cursor: pointer;
        }
        .chat-pic {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #dbdbdb;
            margin-right: 15px;
        }
        .chat-info h4 {
            margin: 0 0 4px 0;
            font-size: 14px;
            color: #262626;
        }
        .chat-info p {
            margin: 0;
            font-size: 13px;
            color: #8e8e8e;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Public-Show</div>
        <div class="nav-links">
            <a href="stage.html">होम</a>
            <a href="notifications.html">नोटिफिकेशन</a>
            <a href="profile.html">प्रोफाइल</a>
            <a href="index.html">लॉग आउट</a>
        </div>
    </header>

    <div class="chat-container">
        <div class="chat-title">संदेश (Direct Messages)</div>

        <div class="chat-item">
            <div class="chat-pic"></div>
            <div class="chat-info">
                <h4>pradeep_kumar</h4>
                <p>नमस्ते! आपका नया शो बहुत अच्छा लगा।</p>
            </div>
        </div>

        <div class="chat-item">
            <div class="chat-pic"></div>
            <div class="chat-info">
                <h4>amit_show</h4>
                <p>अगला शो कब आ रहा है?</p>
            </div>
        </div>
    </div>

</body>
</html>
