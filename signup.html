<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public-Show - साइन अप</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .signup-container {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            padding: 30px;
            width: 350px;
            text-align: center;
            border-radius: 4px;
        }
        .logo {
            font-family: 'Brush Script MT', cursive;
            font-size: 40px;
            margin-bottom: 25px;
            color: #262626;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #dbdbdb;
            background-color: #fafafa;
            border-radius: 3px;
            box-sizing: border-box;
        }
        .signup-btn {
            width: 100%;
            padding: 10px;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-link {
            margin-top: 20px;
            font-size: 14px;
            color: #262626;
        }
        .login-link a {
            color: #0095f6;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="logo">Public-Show</div>
        <p style="color: #8e8e8e; font-size: 14px; margin-bottom: 20px;">दोस्तों के साथ जुड़ने के लिए साइन अप करें।</p>
        
        <form>
            <input type="email" placeholder="मोबाइल नंबर या ईमेल" required>
            <input type="text" placeholder="पूरा नाम" required>
            <input type="text" placeholder="यूसरनेम" required>
            <input type="password" placeholder="पासवर्ड" required>
            <button type="submit" class="signup-btn">साइन अप करें</button>
        </form>

        <div class="login-link">
            क्या खाता पहले से है? <a href="index.html">लॉग इन करें</a>
        </div>
    </div>

</body>
  </html>
