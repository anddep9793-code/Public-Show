<!DOCTYPE html>

<head>

    <title>Public-Show - नोटिफिकेशंस</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #fff;
            border-bottom: 1px solid #dbdbdb;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;

        .notif-container {

            margin: 20px auto;

        }
        .notif-title {
            font-size: 16px;

        .notif-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #efefef;
        }
        .notif-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #dbdbdb;
            margin-right: 15px;
        }
        .notif-text {
            font-size: 14px;
            color: #262626;
        }
